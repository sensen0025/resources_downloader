name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          for f in plugin/index.js plugin/lib/*.js; do node --check "$f"; done
          python3 -m py_compile plugin/lib/browser_worker.py plugin/lib/captcha.py
      - name: Unit tests (offline, no runtime deps)
        run: node plugin/tests/run.mjs
