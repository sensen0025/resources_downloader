<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resources Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#10b981',
              600: '#059669',
            },
            dark: {
              bg: '#0a0d14',
              panel: '#121723',
              card: '#161c2b',
              border: '#1f293d',
              borderLight: '#2b3852',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Inter', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0a0d14;
      color: #e2e8f0;
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-black">

  <!-- Toast -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <!-- Minimal Header -->
  <header class="border-b border-dark-border bg-dark-panel/90 backdrop-blur sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
      
      <!-- Brand -->
      <div class="flex items-center space-x-2.5">
        <div class="w-7 h-7 rounded-lg bg-brand-500 flex items-center justify-center text-dark-bg font-bold">
          <i data-lucide="arrow-down-to-line" class="w-4 h-4 text-dark-bg"></i>
        </div>
        <span class="font-semibold text-sm tracking-tight text-white">Resources Downloader</span>
      </div>

      <!-- Navigation Tabs -->
      <nav class="flex items-center space-x-1 bg-dark-bg p-1 rounded-lg border border-dark-border">
        <button onclick="switchTab('download')" id="tab-btn-download" class="tab-btn px-3 py-1 rounded text-xs font-medium transition bg-dark-card text-white border border-dark-border">
          新建下载
        </button>
        <button onclick="switchTab('tasks')" id="tab-btn-tasks" class="tab-btn px-3 py-1 rounded text-xs font-medium transition text-slate-400 hover:text-white">
          任务看板 <span id="badge-active-tasks" class="hidden ml-1 px-1.5 py-0.2 text-[10px] bg-brand-500 text-black font-bold rounded-full">0</span>
        </button>
        <button onclick="switchTab('files')" id="tab-btn-files" class="tab-btn px-3 py-1 rounded text-xs font-medium transition text-slate-400 hover:text-white">
          文件库
        </button>
        <button onclick="switchTab('system')" id="tab-btn-system" class="tab-btn px-3 py-1 rounded text-xs font-medium transition text-slate-400 hover:text-white">
          系统
        </button>
      </nav>

    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8">

    <!-- ================= TAB 1: 新建下载 (干净利落) ================= -->
    <div id="tab-download" class="tab-content block space-y-6">
      
      <div class="bg-dark-panel rounded-xl border border-dark-border p-6 space-y-5">
        
        <form id="download-form" onsubmit="handleDownloadSubmit(event)" class="space-y-4">
          
          <!-- Direct Input -->
          <div class="flex flex-col sm:flex-row gap-2">
            <input 
              type="text" 
              id="input-url" 
              required
              placeholder="输入或粘贴下载链接 / 关键词..." 
              class="flex-1 px-4 py-3 bg-dark-bg rounded-lg border border-dark-border text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-500 text-sm transition"
            />
            <button 
              type="submit" 
              id="btn-submit"
              class="px-6 py-3 bg-brand-500 hover:bg-brand-600 text-dark-bg font-semibold rounded-lg text-sm transition flex items-center justify-center space-x-2 shrink-0 disabled:opacity-50"
            >
              <i data-lucide="download" class="w-4 h-4"></i>
              <span>开始下载</span>
            </button>
          </div>

          <!-- Controls Bar -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 text-xs">
            
            <div class="flex items-center space-x-2 bg-dark-bg px-3 py-2 rounded-lg border border-dark-border">
              <span class="text-slate-400 shrink-0">类型:</span>
              <select id="select-type" class="bg-transparent text-slate-200 w-full focus:outline-none cursor-pointer">
                <option value="auto">自动识别</option>
                <option value="bilibili">哔哩哔哩 (BBDown)</option>
                <option value="youtube">YouTube (yt-dlp)</option>
                <option value="direct">HTTP/HTTPS 直链</option>
                <option value="hls">HLS / m3u8 切片</option>
                <option value="annas_archive">Anna's Archive 图书</option>
              </select>
            </div>

            <div class="flex items-center space-x-2 bg-dark-bg px-3 py-2 rounded-lg border border-dark-border">
              <span class="text-slate-400 shrink-0">格式:</span>
              <select id="select-format" class="bg-transparent text-slate-200 w-full focus:outline-none cursor-pointer">
                <option value="best">最高画质 (MP4)</option>
                <option value="audio_only">提取纯音频 (MP3)</option>
              </select>
            </div>

            <div class="flex items-center space-x-2 bg-dark-bg px-3 py-2 rounded-lg border border-dark-border">
              <span class="text-slate-400 shrink-0">重命名:</span>
              <input type="text" id="input-custom-name" placeholder="可选自定义文件名" class="bg-transparent text-slate-200 w-full focus:outline-none placeholder-slate-600">
            </div>

          </div>

        </form>

      </div>

    </div>

    <!-- ================= TAB 2: 任务看板 ================= -->
    <div id="tab-tasks" class="tab-content hidden space-y-4">
      
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-white">任务列表</h2>
        <button onclick="loadTasks()" class="px-2.5 py-1 text-xs bg-dark-panel hover:bg-dark-card border border-dark-border rounded text-slate-300 transition flex items-center space-x-1">
          <i data-lucide="refresh-cw" class="w-3 h-3"></i>
          <span>刷新</span>
        </button>
      </div>

      <div id="tasks-container" class="space-y-3">
        <div class="text-center py-12 text-slate-500 text-xs">暂无任务</div>
      </div>

    </div>

    <!-- ================= TAB 3: 文件库 ================= -->
    <div id="tab-files" class="tab-content hidden space-y-4">
      
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-white">下载文件</h2>
        <div class="flex items-center space-x-2">
          <input 
            type="text" 
            id="input-file-search" 
            oninput="filterFiles()" 
            placeholder="搜索..." 
            class="px-2.5 py-1 bg-dark-panel border border-dark-border rounded text-xs text-slate-200 focus:outline-none focus:border-brand-500 w-40"
          />
          <div class="flex items-center rounded border border-dark-border overflow-hidden text-xs">
            <button id="btn-files-view-tasks" onclick="switchFilesView('tasks')" class="px-2.5 py-1 bg-brand-500 text-dark-bg font-semibold">按任务</button>
            <button id="btn-files-view-all" onclick="switchFilesView('all')" class="px-2.5 py-1 bg-dark-panel text-slate-300 hover:bg-dark-card">全部文件</button>
          </div>
          <button onclick="loadFiles()" class="px-2.5 py-1 text-xs bg-dark-panel hover:bg-dark-card border border-dark-border rounded text-slate-300 transition flex items-center space-x-1">
            <i data-lucide="refresh-cw" class="w-3 h-3"></i>
            <span>刷新</span>
          </button>
        </div>
      </div>

      <div id="files-task-groups" class="space-y-3">
        <!-- Task-grouped files (agent deliverables per task) -->
      </div>

      <div id="files-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
        <!-- Files dynamic (flat view) -->
      </div>

    </div>

    <!-- ================= TAB 4: 系统状态 ================= -->
    <div id="tab-system" class="tab-content hidden space-y-4">
      
      <h2 class="text-sm font-semibold text-white">环境与状态</h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        
        <!-- Disk & Storage -->
        <div class="bg-dark-panel p-4 rounded-xl border border-dark-border space-y-3">
          <h3 class="text-xs font-semibold text-slate-300">存储信息</h3>
          <div id="system-disk-info" class="space-y-2 text-xs font-mono text-slate-400">
            <!-- Dynamic Disk -->
          </div>
        </div>

        <!-- Binary Tools -->
        <div class="bg-dark-panel p-4 rounded-xl border border-dark-border space-y-3">
          <h3 class="text-xs font-semibold text-slate-300">底层工具</h3>
          <div id="system-tools-list" class="space-y-2 text-xs font-mono">
            <!-- Dynamic Tools -->
          </div>
        </div>

      </div>

    </div>

  </main>

  <!-- Probe Modal -->
  <div id="probe-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-dark-panel max-w-xl w-full p-5 rounded-xl border border-dark-border space-y-4">
      <div class="flex items-center justify-between border-b border-dark-border pb-2.5">
        <h3 class="font-semibold text-white text-xs">文件探针</h3>
        <button onclick="closeProbeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div class="space-y-2 font-mono text-xs text-slate-300" id="probe-modal-content"></div>
    </div>
  </div>

  <!-- Player Modal -->
  <div id="player-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="max-w-3xl w-full bg-dark-panel border border-dark-border rounded-xl overflow-hidden flex flex-col">
      <div class="flex items-center justify-between px-4 py-2.5 border-b border-dark-border">
        <span class="text-xs font-medium text-slate-200 truncate" id="player-title">播放</span>
        <button onclick="closePlayerModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div class="relative bg-black flex items-center justify-center min-h-[300px]" id="player-container"></div>
    </div>
  </div>

  <script>
    let currentTab = 'download';
    let tasksMap = {};
    let allFiles = [];

    function showToast(message, isError = false) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-3.5 py-2 rounded-lg text-xs font-medium shadow-lg transition-all ${
        isError ? 'bg-red-900/90 text-red-200 border border-red-700' : 'bg-dark-card text-slate-200 border border-dark-border'
      }`;
      toast.innerText = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-dark-card', 'text-white', 'border', 'border-dark-border');
        btn.classList.add('text-slate-400');
      });

      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-btn-${tab}`);
      activeBtn.classList.add('bg-dark-card', 'text-white', 'border', 'border-dark-border');
      activeBtn.classList.remove('text-slate-400');

      if (tab === 'tasks') loadTasks();
      if (tab === 'files') loadFiles();
      if (tab === 'system') loadSystemInfo();
      lucide.createIcons();
    }

    async function handleDownloadSubmit(e) {
      e.preventDefault();
      const url = document.getElementById('input-url').value.trim();
      if (!url) return;

      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerHTML = `<span>提交中...</span>`;

      try {
        const payload = {
          url_or_query: url,
          download_type: document.getElementById('select-type').value,
          format_option: document.getElementById('select-format').value,
          output_name: document.getElementById('input-custom-name').value.trim() || null
        };

        const res = await fetch('/api/v1/download', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        const created = await res.json();
        lastSubmittedTaskId = created.id;
        
        document.getElementById('input-url').value = '';
        showToast('任务已创建');
        switchTab('tasks');
      } catch (err) {
        showToast('创建失败: ' + err, true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="download" class="w-4 h-4"></i><span>开始下载</span>`;
        lucide.createIcons();
      }
    }

    async function loadTasks() {
      try {
        const res = await fetch('/api/v1/tasks');
        const tasks = await res.json();
        tasks.forEach(t => tasksMap[t.id] = t);
        renderTasksList();
      } catch (e) {
        console.error(e);
      }
    }

    function gotoTaskFiles(id) {
      focusTaskId = id;
      if (filesView !== 'tasks') switchFilesView('tasks');
      else loadFiles();
      switchTab('files');
    }

    function renderTasksList() {
      const container = document.getElementById('tasks-container');
      const tasks = Object.values(tasksMap).sort((a,b) => b.created_at - a.created_at);
      
      const activeCount = tasks.filter(t => t.status === 'running').length;
      const badge = document.getElementById('badge-active-tasks');
      if (activeCount > 0) {
        badge.innerText = activeCount;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      if (tasks.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-500 text-xs">暂无下载任务</div>`;
        return;
      }

      container.innerHTML = tasks.map(t => {
        const isRunning = t.status === 'running';
        const isSuccess = t.status === 'completed';
        
        const statusText = isRunning 
          ? `<span class="text-blue-400 font-mono">下载中</span>`
          : isSuccess
          ? `<span class="text-brand-500 font-mono">已完成</span>`
          : `<span class="text-red-400 font-mono">失败</span>`;

        return `
          <div class="bg-dark-panel p-4 rounded-xl border border-dark-border space-y-3">
            <div class="flex items-start justify-between gap-3">
              <div class="space-y-1 min-w-0 flex-1">
                <div class="flex items-center space-x-2">
                  <span class="text-[10px] px-1.5 py-0.5 rounded bg-dark-bg text-slate-400 font-mono border border-dark-border">${t.skill_used}</span>
                  <h3 class="font-medium text-slate-100 text-xs truncate" title="${t.title || t.url_or_query}">${t.title || t.url_or_query}</h3>
                </div>
                <div class="text-[11px] text-slate-500 truncate font-mono">${t.url_or_query}</div>
              </div>
              <div class="text-xs">${statusText}</div>
            </div>

            <!-- Progress -->
            <div class="space-y-1">
              <div class="flex justify-between text-[11px] font-mono text-slate-400">
                <span>${t.progress.toFixed(1)}%</span>
                <span>${t.speed_text || ''} ${t.eta_text ? '· ' + t.eta_text : ''}</span>
              </div>
              <div class="w-full bg-dark-bg rounded-full h-1.5 overflow-hidden">
                <div class="h-full bg-brand-500 transition-all duration-300" style="width: ${Math.max(t.progress, isRunning ? 5 : 0)}%"></div>
              </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center justify-between text-xs pt-1 border-t border-dark-border/50">
              <button onclick="toggleLogs('${t.id}')" class="text-slate-400 hover:text-slate-200 flex items-center space-x-1 font-mono text-[11px]">
                <i data-lucide="terminal" class="w-3 h-3"></i>
                <span>日志 (${t.logs ? t.logs.length : 0})</span>
              </button>

              <div class="flex items-center space-x-2">
                ${(t.delivered_files && t.delivered_files.length > 0) ? `
                  <button onclick="gotoTaskFiles('${t.id}')" class="px-2 py-0.5 bg-brand-500/15 hover:bg-brand-500/25 text-brand-400 rounded text-[11px] border border-brand-500/30 flex items-center space-x-1">
                    <span>产出 ${t.delivered_files.length} 个文件</span>
                    <i data-lucide="folder-down" class="w-3 h-3"></i>
                  </button>
                ` : ''}
                ${t.output_file ? `
                  <button onclick="openProbeModal('${encodeURIComponent(t.output_file)}')" class="px-2 py-0.5 bg-dark-bg hover:bg-dark-card text-slate-300 rounded text-[11px] border border-dark-border">
                    探针
                  </button>
                ` : ''}
                ${isRunning ? `
                  <button onclick="cancelTask('${t.id}')" class="px-2 py-0.5 bg-red-950/40 hover:bg-red-900/50 text-red-300 rounded text-[11px] border border-red-800/40">
                    取消
                  </button>
                ` : ''}
              </div>
            </div>

            <!-- Logs -->
            <div id="logs-${t.id}" class="hidden bg-black/80 p-3 rounded-lg text-slate-400 font-mono text-[10px] max-h-40 overflow-y-auto custom-scroll space-y-0.5">
              ${(t.logs || []).map(l => `<div class="break-all">${escapeHtml(l)}</div>`).join('') || '<div>等待输出...</div>'}
            </div>

          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function toggleLogs(id) {
      const el = document.getElementById(`logs-${id}`);
      if (el) el.classList.toggle('hidden');
    }

    async function cancelTask(id) {
      try {
        await fetch(`/api/v1/tasks/${id}/cancel`, {method: 'POST'});
        showToast('已取消任务');
      } catch (e) {
        showToast('取消失败: ' + e, true);
      }
    }

    let filesView = 'tasks';      // 'tasks' = group by task | 'all' = flat
    let focusTaskId = null;       // highlight this task group after completion jump
    let lastSubmittedTaskId = null;

    async function loadFiles() {
      try {
        const [filesRes, tasksRes] = await Promise.all([fetch('/api/v1/files'), fetch('/api/v1/tasks')]);
        allFiles = await filesRes.json();
        const tasks = await tasksRes.json();
        tasks.forEach(t => tasksMap[t.id] = t);
        renderFiles();
      } catch (e) {
        console.error(e);
      }
    }

    function switchFilesView(v) {
      filesView = v;
      const btnT = document.getElementById('btn-files-view-tasks');
      const btnA = document.getElementById('btn-files-view-all');
      const active = 'px-2.5 py-1 bg-brand-500 text-dark-bg font-semibold';
      const idle = 'px-2.5 py-1 bg-dark-panel text-slate-300 hover:bg-dark-card';
      btnT.className = v === 'tasks' ? active : idle;
      btnA.className = v === 'all' ? active : idle;
      loadFiles();
    }

    function renderFiles() {
      const q = (document.getElementById('input-file-search').value || '').toLowerCase();
      const groupBox = document.getElementById('files-task-groups');
      const grid = document.getElementById('files-grid');
      if (filesView === 'all') {
        groupBox.classList.add('hidden');
        grid.classList.remove('hidden');
        renderFilesGrid(allFiles.filter(f => f.name.toLowerCase().includes(q)));
      } else {
        grid.classList.add('hidden');
        groupBox.classList.remove('hidden');
        renderTaskGroups(q);
      }
    }

    function fmtTime(ts) {
      if (!ts) return '';
      const d = new Date(ts * 1000);
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function fileActions(f, isRow) {
      const isVideo = (f.mime_type || '').startsWith('video/');
      const isAudio = (f.mime_type || '').startsWith('audio/');
      const enc = (s) => encodeURIComponent(s || '');
      return `
        <div class="flex items-center space-x-1.5 shrink-0">
          ${(isVideo || isAudio) ? `
            <button onclick="openPlayerModal('${enc(f.rel_path)}','${enc(f.name)}','${isVideo ? 'video' : 'audio'}','${enc(f.root)}')" class="px-2 py-0.5 bg-brand-500 hover:bg-brand-600 text-dark-bg font-semibold rounded text-[11px]">播放</button>
          ` : ''}
          <button onclick="openProbeModal('${enc(f.path)}')" class="px-2 py-0.5 bg-dark-bg hover:bg-dark-card text-slate-300 rounded text-[11px] border border-dark-border">探针</button>
          <a href="/api/v1/files/download/${enc(f.rel_path)}?root=${enc(f.root)}" download class="px-2 py-0.5 bg-dark-bg hover:bg-dark-card text-slate-300 rounded text-[11px] border border-dark-border">下载</a>
        </div>
      `;
    }

    function renderTaskGroups(query) {
      const box = document.getElementById('files-task-groups');
      const tasks = Object.values(tasksMap)
        .filter(t => Array.isArray(t.delivered_files) && t.delivered_files.length > 0)
        .sort((a, b) => (b.completed_at || b.created_at) - (a.completed_at || a.created_at));

      if (tasks.length === 0) {
        box.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs">暂无带产出的任务（跑一个下载任务后按任务分组显示）</div>`;
        return;
      }

      box.innerHTML = tasks.map(t => {
        const files = t.delivered_files;
        const qf = query ? files.filter(f => f.name.toLowerCase().includes(query)) : files;
        const isFocus = t.id === focusTaskId;
        return `
          <div id="task-files-group-${t.id}" class="bg-dark-panel rounded-xl border ${isFocus ? 'border-brand-500 ring-2 ring-brand-500/40' : 'border-dark-border'} overflow-hidden">
            <div class="flex items-center justify-between gap-3 px-3.5 py-2.5 border-b border-dark-border/60 flex-wrap">
              <div class="space-y-0.5 min-w-0">
                <div class="flex items-center space-x-2">
                  <span class="text-[10px] px-1.5 py-0.5 rounded bg-dark-bg text-slate-400 font-mono border border-dark-border">${t.skill_used || ''}</span>
                  <span class="text-[10px] px-1.5 py-0.5 rounded bg-brand-500/15 text-brand-400 font-mono">${t.status === 'completed' ? '已完成' : t.status}</span>
                  <h3 class="font-medium text-slate-100 text-xs truncate" title="${t.title || t.url_or_query}">${t.title || t.url_or_query}</h3>
                </div>
                <div class="text-[10px] text-slate-500 font-mono truncate">#${t.id} · ${fmtTime(t.completed_at || t.created_at)} · ${t.url_or_query}</div>
              </div>
              <div class="text-[10px] text-slate-500 font-mono shrink-0">${files.length} 个文件</div>
            </div>
            <div class="divide-y divide-dark-border/40">
              ${qf.map(f => `
                <div class="flex items-center justify-between gap-2 px-3.5 py-2">
                  <div class="min-w-0 space-y-0.5">
                    <div class="flex items-center space-x-2">
                      <span class="text-[10px] px-1 rounded ${f.role === 'primary' ? 'bg-brand-500/15 text-brand-400' : 'bg-slate-600/30 text-slate-400'}">${f.role === 'primary' ? '主' : '附'}</span>
                      <span class="text-xs text-slate-200 truncate" title="${f.name}">${f.name}</span>
                    </div>
                    <div class="text-[10px] font-mono text-slate-500 truncate">${f.format_name || ''} · ${(f.size / (1024 * 1024)).toFixed(2)} MB${f.note ? ' · ' + f.note : ''}</div>
                  </div>
                  ${fileActions(f)}
                </div>
              `).join('')}
              ${qf.length === 0 ? '<div class="px-3.5 py-3 text-slate-500 text-[11px]">无匹配文件</div>' : ''}
            </div>
          </div>
        `;
      }).join('');

      if (focusTaskId) {
        const el = document.getElementById(`task-files-group-${focusTaskId}`);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          setTimeout(() => { focusTaskId = null; renderFiles(); }, 5000);
        }
      }
    }

    function filterFiles() {
      renderFiles();
    }

    function renderFilesGrid(files) {
      const grid = document.getElementById('files-grid');
      if (files.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 text-xs">暂无文件</div>`;
        return;
      }

      grid.innerHTML = files.map(f => {
        const isVideo = f.mime_type.startsWith('video/');
        const isAudio = f.mime_type.startsWith('audio/');
        const mbSize = (f.size / (1024 * 1024)).toFixed(2);

        return `
          <div class="bg-dark-panel p-3.5 rounded-xl border border-dark-border flex flex-col justify-between space-y-3">
            <div class="space-y-1">
              <div class="flex items-center justify-between text-[11px] font-mono text-slate-400">
                <span>
                  <span class="text-[10px] px-1 rounded mr-1 ${f.root === 'repo' ? 'bg-brand-500/15 text-brand-400' : 'bg-slate-600/40 text-slate-400'}">${f.root === 'repo' ? 'agent' : 'dl'}</span>${f.format_name}
                </span>
                <span>${mbSize} MB</span>
              </div>
              <h4 class="text-xs font-medium text-slate-200 truncate" title="${f.name}">${f.name}</h4>
            </div>

            <div class="flex items-center justify-between text-xs pt-2 border-t border-dark-border/50">
              <button onclick="openProbeModal('${encodeURIComponent(f.full_path)}')" class="text-slate-400 hover:text-slate-200 text-[11px]">
                探针
              </button>
              <div class="flex items-center space-x-1.5">
                ${(isVideo || isAudio) ? `
                  <button onclick="openPlayerModal('${encodeURIComponent(f.rel_path)}', '${encodeURIComponent(f.name)}', '${isVideo ? 'video' : 'audio'}', '${f.root}')" class="px-2 py-0.5 bg-brand-500 hover:bg-brand-600 text-dark-bg font-semibold rounded text-[11px]">
                    播放
                  </button>
                ` : ''}
                <a href="/api/v1/files/download/${encodeURIComponent(f.rel_path)}?root=${encodeURIComponent(f.root)}" download class="px-2 py-0.5 bg-dark-bg hover:bg-dark-card text-slate-300 rounded text-[11px] border border-dark-border">
                  下载
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    async function openProbeModal(encodedPath) {
      const modal = document.getElementById('probe-modal');
      const content = document.getElementById('probe-modal-content');
      modal.classList.remove('hidden');
      content.innerHTML = `<div class="py-6 text-center text-xs text-slate-400">探针校验中...</div>`;

      try {
        const res = await fetch(`/api/v1/probe?path=${encodedPath}`);
        const p = await res.json();
        content.innerHTML = `
          <div class="space-y-2">
            <div class="flex justify-between py-1 border-b border-dark-border/60"><span class="text-slate-500">文件:</span><span class="text-slate-200 truncate max-w-[280px]">${p.file_name}</span></div>
            <div class="flex justify-between py-1 border-b border-dark-border/60"><span class="text-slate-500">大小:</span><span class="text-slate-200">${(p.file_size/1024/1024).toFixed(3)} MB</span></div>
            <div class="flex justify-between py-1 border-b border-dark-border/60"><span class="text-slate-500">格式:</span><span class="text-brand-500">${p.format_name} (${p.mime_type})</span></div>
            <div class="flex justify-between py-1 border-b border-dark-border/60"><span class="text-slate-500">魔数:</span><span class="text-yellow-400">${p.magic_hex}</span></div>
            <div class="flex justify-between py-1 border-b border-dark-border/60"><span class="text-slate-500">状态:</span><span class="${p.is_valid ? 'text-brand-500' : 'text-red-400'}">${p.is_valid ? 'VALID' : 'CORRUPTED'}</span></div>
            <div class="py-1"><span class="text-slate-500">SHA256:</span><div class="text-[10px] text-slate-300 break-all bg-dark-bg p-2 rounded mt-1 border border-dark-border">${p.sha256}</div></div>
          </div>
        `;
      } catch (e) {
        content.innerHTML = `<div class="text-red-400">校验失败: ${e}</div>`;
      }
    }

    function closeProbeModal() {
      document.getElementById('probe-modal').classList.add('hidden');
    }

    function openPlayerModal(relPath, fileName, type, root) {
      const modal = document.getElementById('player-modal');
      const container = document.getElementById('player-container');
      const title = document.getElementById('player-title');
      
      title.innerText = decodeURIComponent(fileName);
      const streamUrl = `/api/v1/files/stream/${relPath}?root=${encodeURIComponent(root || 'home')}`;

      if (type === 'video') {
        container.innerHTML = `<video src="${streamUrl}" controls autoplay class="w-full max-h-[60vh] focus:outline-none"></video>`;
      } else {
        container.innerHTML = `
          <div class="p-8 text-center space-y-3 w-full">
            <audio src="${streamUrl}" controls autoplay class="w-full focus:outline-none"></audio>
          </div>
        `;
      }
      modal.classList.remove('hidden');
    }

    function closePlayerModal() {
      const container = document.getElementById('player-container');
      container.innerHTML = '';
      document.getElementById('player-modal').classList.add('hidden');
    }

    async function loadSystemInfo() {
      try {
        const res = await fetch('/api/v1/system');
        const data = await res.json();
        
        const toolsList = document.getElementById('system-tools-list');
        toolsList.innerHTML = Object.entries(data.tools).map(([k, v]) => `
          <div class="flex items-center justify-between p-2 bg-dark-bg rounded border border-dark-border">
            <span class="text-slate-400 uppercase">${k}</span>
            <span class="${v.installed ? 'text-brand-500' : 'text-red-400'}">${v.installed ? v.version : '未就绪'}</span>
          </div>
        `).join('');

        const diskInfo = document.getElementById('system-disk-info');
        diskInfo.innerHTML = `
          <div class="flex justify-between"><span>路径:</span><span class="text-slate-200">${data.download_dir}</span></div>
          <div class="flex justify-between"><span>磁盘:</span><span class="text-slate-200">${data.disk.used_gb}G / ${data.disk.total_gb}G (${data.disk.percent_used}%)</span></div>
          <div class="w-full bg-dark-bg rounded-full h-1.5 overflow-hidden">
            <div class="h-full bg-brand-500" style="width: ${data.disk.percent_used}%"></div>
          </div>
          <div class="flex justify-between pt-1 border-t border-dark-border text-slate-500">
            <span>运行中: ${data.active_tasks}</span>
            <span>总任务: ${data.total_tasks}</span>
          </div>
        `;
      } catch (e) {
        console.error(e);
      }
    }

    function connectSSE() {
      const eventSource = new EventSource('/api/v1/tasks/events');
      eventSource.onmessage = (event) => {
        try {
          const task = JSON.parse(event.data);
          const prev = tasksMap[task.id];
          const justCompleted = task.status === 'completed' && prev && prev.status !== 'completed';
          const delivered = Array.isArray(task.delivered_files) ? task.delivered_files.length : 0;
          tasksMap[task.id] = task;
          if (currentTab === 'tasks') renderTasksList();
          if (justCompleted) {
            if (currentTab === 'tasks' && task.id === lastSubmittedTaskId && delivered > 0) {
              // 任务完成 → 自动跳到文件库并高亮该任务产出组
              showToast('✅ 任务完成，已跳到该任务的产出文件');
              setTimeout(() => gotoTaskFiles(task.id), 600);
            } else if (currentTab === 'files') {
              loadFiles();
            }
          }
        } catch (e) {
          console.error(e);
        }
      };
      eventSource.onerror = () => {
        eventSource.close();
        setTimeout(connectSSE, 3000);
      };
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadTasks();
      connectSSE();
    });
  </script>
</body>
</html>
